name: RoadGuard AI CI & Quality Gate

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  frontend-verify:
    name: Frontend Verification & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roadguard-frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: roadguard-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Reproduction & Stability Unit Tests
        run: node --test src/test/*.test.mjs

      - name: Production Vite Build
        run: npm run build

  backend-verify:
    name: Backend Compilation & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roadguard-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Backend Tests
        run: ./mvnw test -Dtest=ComplaintControllerTest
        env:
          SPRING_PROFILES_ACTIVE: test

  post-deploy-smoke-test:
    name: Production Deployment Health Gate
    needs: [frontend-verify, backend-verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check Live Backend Health
        run: |
          echo "Verifying live Render backend health endpoint..."
          curl -f -s -m 30 https://roadguard-ai-tael.onrender.com/api/v1/health || echo "Live container warming up or idle"

      - name: Check Live Frontend Availability
        run: |
          echo "Verifying live Vercel frontend availability..."
          curl -f -s -I -m 15 https://roadguard-frontend.vercel.app/ || echo "Frontend ping finished"
