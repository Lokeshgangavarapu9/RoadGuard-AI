# ==============================================================
#  RoadGuard AI — Backend Application Configuration
#  STAGE A (H2 in-memory database, local file storage, Mailpit)
# ==============================================================
#
#  NEVER commit real secrets. Copy this file to .env and fill it.
#  This file is safe to commit — it contains NO real credentials.
# ==============================================================

spring.application.name=RoadGuard AI

# ── SERVER ────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/

# ── DATABASE: H2 (Dev fallback) or PostgreSQL (Production) ────
# Defaults to in-memory H2 if SPRING_DATASOURCE_URL and DATABASE_URL are not set.
# In production, set SPRING_DATASOURCE_URL or DATABASE_URL (jdbc:postgresql://, postgres://, or postgresql://)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:roadguarddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
# H2 console is disabled in production by default
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ── FLYWAY MIGRATIONS ─────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ── FILE UPLOAD & EVIDENCE STORAGE ────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Local filesystem storage (Stage A — no MinIO/Docker required)
roadguard.storage.type=local
roadguard.storage.local.base-path=${ROADGUARD_UPLOAD_DIR:./uploads/evidence}
roadguard.storage.max-file-size-bytes=20971520

# Allowed evidence MIME types
roadguard.upload.allowed-types=image/jpeg,image/png,image/webp,video/mp4,video/webm

# ── EMAIL (Mailpit SMTP for local dev) ────────────────────────
# Start Mailpit: see README.md > Email Configuration
# Web UI: http://localhost:8025
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
roadguard.mail.from=noreply@roadguard-ai.local
roadguard.mail.enabled=${MAIL_ENABLED:false}

# ── AI INFERENCE ──────────────────────────────────────────────
# Mode: ONNX (Genuine Java ONNX Runtime inference using trained road damage model)
#       MOCK (Clearly labelled simulated detections for demo journeys only)
#       HTTP (External FastAPI service — Stage B)
roadguard.inference.mode=${INFERENCE_MODE:ONNX}
roadguard.inference.onnx.model-path=${ONNX_MODEL_PATH:${ROADGUARD_MODEL_PATH:./models/road_damage_yolo.onnx}}
roadguard.inference.http.base-url=${INFERENCE_HTTP_URL:http://localhost:8000}
roadguard.inference.confidence-threshold=${CONFIDENCE_THRESHOLD:0.25}
roadguard.inference.temporal.window-size=4
roadguard.inference.temporal.min-confirmations=2

# ── GEOSPATIAL ────────────────────────────────────────────────
# Deduplication radius in metres (Hypothesis H1 — empirically unvalidated)
roadguard.geospatial.dedup-radius-metres=15.0
roadguard.geospatial.max-gps-accuracy-metres=50.0

# ── CORS ──────────────────────────────────────────────────────
# Frontend origins allowed to call the backend
roadguard.cors.allowed-origins=${ROADGUARD_CORS_ALLOWED_ORIGINS:${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,https://roadguard-frontend.vercel.app}}

# ── SECURITY ─────────────────────────────────────────────────
# Stage A: all API endpoints are open (no authentication required)
# Stage B: set to true to enable JWT authentication
roadguard.security.auth-enabled=${AUTH_ENABLED:false}
roadguard.security.jwt-secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_THIS_IS_NOT_SECURE}
roadguard.security.jwt-expiry-seconds=86400

# ── AUTOMATION WORKER ─────────────────────────────────────────
roadguard.automation.worker-secret=${AUTOMATION_WORKER_SECRET:}
roadguard.automation.lease-timeout-seconds=${AUTOMATION_LEASE_TIMEOUT_SECONDS:180}
roadguard.automation.max-retries=${AUTOMATION_MAX_RETRIES:3}

# ── LOGGING ──────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.roadguard=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
